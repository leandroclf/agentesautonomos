version: '3.8'

services:

  # Interface Agent
  interface-agent:
    build:
      context: .
      dockerfile: ./docker/interface-agent.Dockerfile
    container_name: interface-agent
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AGENT_NAME=interface
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - SQS_ENDPOINT=http://localstack:4566