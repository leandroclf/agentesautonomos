        '200':
          description: Validação realizada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid:
                            type: boolean
                            description: Se os dados são válidos
                          errors:
                            type: array
                            items:
                              type: string
                            description: Lista de erros de validação
                        required:
                          - valid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Monitoramento
  /monitoring/health:
    get:
      tags:
        - Monitoramento
      summary: Verificar saúde do sistema
      description: Retorna o status de saúde de todos os componentes
      responses:
        '200':
          description: Status de saúde retornado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [healthy, degraded, unhealthy]
                            description: Status geral do sistema
                          components:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                status:
                                  type: string
                                  enum: [healthy, degraded, unhealthy]
                                lastCheck:
                                  type: string
                                  format: date-time
                                details:
                                  type: object
                              required:
                                - status
                                - lastCheck
                          timestamp:
                            type: string
                            format: date-time
                            description: Timestamp da verificação
                        required:
                          - status
                          - components
                          - timestamp
        '503':
          description: Sistema não saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /monitoring/metrics:
    get:
      tags:
        - Monitoramento
      summary: Obter métricas do sistema
      description: Retorna métricas detalhadas do sistema
      security:
        - BearerAuth: []
      parameters:
        - name: startTime
          in: query
          description: Timestamp inicial para as métricas
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          description: Timestamp final para as métricas
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          description: Granularidade das métricas
          schema:
            type: string
            enum: [minute, hour, day]
            default: hour
      responses:
        '200':
          description: Métricas retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Número da página (começando em 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Número de itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SessionIdParam:
      name: sessionId
      in: path
      required: true
      description: ID único da sessão
      schema:
        type: string
        format: uuid

    EventIdParam:
      name: eventId
      in: path
      required: true
      description: ID único do evento
      schema:
        type: string
        format: uuid

    PlanIdParam:
      name: planId
      in: path
      required: true
      description: ID único do plano
      schema:
        type: string
        format: uuid

    TaskIdParam:
      name: taskId
      in: path
      required: true
      description: ID único da tarefa
      schema:
        type: string
        format: uuid

    ConflictIdParam:
      name: conflictId
      in: path
      required: true
      description: ID único do conflito
      schema:
        type: string
        format: uuid

    WorkflowIdParam:
      name: workflowId
      in: path
      required: true
      description: ID único do workflow
      schema:
        type: string
        format: uuid

    SchemaIdParam:
      name: schemaId
      in: path
      required: true
      description: ID único do schema
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Base Schemas
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indica se a operação foi bem-sucedida
        message:
          type: string
          description: Mensagem descritiva da resposta
        timestamp:
          type: string
          format: date-time
          description: Timestamp da resposta
      required:
        - success
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  description: Código do erro
                details:
                  type: object
                  description: Detalhes adicionais do erro
              required:
                - code
          required:
            - error

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Página atual
        limit:
          type: integer
          description: Itens por página
        total:
          type: integer
          description: Total de itens
        totalPages:
          type: integer
          description: Total de páginas
        hasNext:
          type: boolean
          description: Se há próxima página
        hasPrev:
          type: boolean
          description: Se há página anterior
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do usuário
        name:
          type: string
          description: Nome completo do usuário
        email:
          type: string
          format: email
          description: Email do usuário
        role:
          type: string
          enum: [admin, user, agent]
          description: Papel do usuário no sistema
        createdAt:
          type: string
          format: date-time
          description: Data de criação
        updatedAt:
          type: string
          format: date-time
          description: Data de atualização
      required:
        - id
        - name
        - email
        - role
        - createdAt
        - updatedAt

    # Session Schemas
    CreateSessionRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome da sessão
          example: Sessão de Planejamento
        description:
          type: string
          description: Descrição da sessão
        context:
          type: object
          description: Contexto inicial da sessão
        metadata:
          type: object
          description: Metadados adicionais
      required:
        - name

    UpdateSessionRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome da sessão
        description:
          type: string
          description: Descrição da sessão
        status:
          type: string
          enum: [active, inactive, completed]
          description: Status da sessão
        context:
          type: object
          description: Contexto da sessão
        metadata:
          type: object
          description: Metadados adicionais

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único da sessão
        name:
          type: string
          description: Nome da sessão
        description:
          type: string
          description: Descrição da sessão
        status:
          type: string
          enum: [active, inactive, completed]
          description: Status da sessão
        userId:
          type: string
          format: uuid
          description: ID do usuário proprietário
        context:
          type: object
          description: Contexto da sessão
        metadata:
          type: object
          description: Metadados adicionais
        createdAt:
          type: string
          format: date-time
          description: Data de criação
        updatedAt:
          type: string
          format: date-time
          description: Data de atualização
      required:
        - id
        - name
        - status
        - userId
        - createdAt
        - updatedAt

    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Session'
          required:
            - data

    # Message Schemas
    CreateMessageRequest:
      type: object
      properties:
        content:
          type: string
          description: Conteúdo da mensagem
        type:
          type: string
          enum: [text, image, file, command]
          description: Tipo da mensagem
        metadata:
          type: object
          description: Metadados adicionais
      required:
        - content
        - type

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único da mensagem
        sessionId:
          type: string
          format: uuid
          description: ID da sessão
        content:
          type: string
          description: Conteúdo da mensagem
        type:
          type: string
          enum: [text, image, file, command]
          description: Tipo da mensagem
        sender:
          type: string
          enum: [user, agent, system]
          description: Remetente da mensagem
        metadata:
          type: object
          description: Metadados adicionais
        createdAt:
          type: string
          format: date-time
          description: Data de criação
      required:
        - id
        - sessionId
        - content
        - type
        - sender
        - createdAt

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Message'
          required:
            - data

    # Event Schemas
    CreateEventRequest:
      type: object
      properties:
        type:
          type: string
          description: Tipo do evento
        source:
          type: string
          description: Origem do evento
        data:
          type: object
          description: Dados do evento
        metadata:
          type: object
          description: Metadados adicionais
      required:
        - type
        - source
        - data

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do evento
        type:
          type: string
          description: Tipo do evento
        source:
          type: string
          description: Origem do evento
        data:
          type: object
          description: Dados do evento
        status:
          type: string
          enum: [pending, processing, processed, failed]
          description: Status do processamento
        metadata:
          type: object
          description: Metadados adicionais
        createdAt:
          type: string
          format: date-time
          description: Data de criação
        processedAt:
          type: string
          format: date-time
          description: Data de processamento
      required:
        - id
        - type
        - source
        - data
        - status
        - createdAt

    EventResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Event'
          required:
            - data

    # Plan Schemas
    CreatePlanRequest:
      type: object
      properties:
        name:
          type: string
          description: Nome do plano
        description:
          type: string
          description: Descrição do plano
        goals:
          type: array
          items:
            type: string
          description: Objetivos do plano
        constraints:
          type: object
          description: Restrições e limitações do plano
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: Data de criação do plano
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização
        createdBy:
          type: string
          description: ID do usuário que criou o plano
      required:
        - id
        - name
        - status
        - goals
        - createdAt
        - createdBy

