openapi: 3.0.1
info:
  title: Sistema de Agentes Autônomos API
  description: |
    API completa do sistema de agentes autônomos baseado em arquitetura SOI
    (Self-Organizing Intelligence).
    
    ## Características
    
    **Arquitetura SOI**: Agentes com criação, iteração e interação
    **Agentes**: Arquiteturas que refletem multi-agente
    **Eventos**: Processamento de eventos em tempo real
    **Escalas Distribuídas**: Rede para performance
    **Monitoramento**: Prometheus e Grafana
    
    ## Agentes Principais
    
    - **Interface Agent**: Gerencia interação com usuários
    - **Event Agent**: Processa eventos do sistema
    - **Planning Agent**: Realiza planejamento de tarefas
    - **Execution Agent**: Executa tarefas planejadas
    - **Mediator Agent**: Medeia comunicação entre agentes
    - **Orchestrator Agent**: Orquestra fluxos complexos
    
  version: 3.0.1
  contact:
    name: Equipe de Desenvolvimento
    email: dev@agentesautonomos.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Servidor de desenvolvimento
  - url: https://api.agentesautonomos.com
    description: Servidor de produção

security:
  - BearerAuth: []

paths:
  # Autenticação
  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Realizar login
      description: Autentica um usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email do usuário
                password:
                  type: string
                  format: password
                  description: Senha do usuário
              required:
                - email
                - password
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Token JWT
                          user:
                            $ref: '#/components/schemas/User'
                        required:
                          - token
                          - user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: Cria uma nova conta de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome completo do usuário
                email:
                  type: string
                  format: email
                  description: Email do usuário
                password:
                  type: string
                  format: password
                  description: Senha do usuário
              required:
                - name
                - email
                - password
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email já está em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags:
        - Autenticação
      summary: Renovar token
      description: Renova um token JWT válido
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Novo token JWT
                        required:
                          - token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Interface Agent
  /interface/sessions:
    get:
      tags:
        - Interface Agent
      summary: Listar sessões
      description: Retorna uma lista paginada de sessões do usuário
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filtrar por status da sessão
          schema:
            type: string
            enum: [active, inactive, completed]
      responses:
        '200':
          description: Lista de sessões retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions:
                            type: array
                            items:
                              $ref: '#/components/schemas/Session'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                        required:
                          - sessions
                          - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Interface Agent
      summary: Criar nova sessão
      description: Cria uma nova sessão de interação
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Sessão criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /interface/sessions/{sessionId}:
    get:
      tags:
        - Interface Agent
      summary: Obter sessão específica
      description: Retorna detalhes de uma sessão específica
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Sessão retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Interface Agent
      summary: Atualizar sessão
      description: Atualiza informações de uma sessão existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Sessão atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Interface Agent
      summary: Excluir sessão
      description: Remove uma sessão existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '204':
          description: Sessão excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /interface/sessions/{sessionId}/messages:
    get:
      tags:
        - Interface Agent
      summary: Listar mensagens da sessão
      description: Retorna mensagens de uma sessão específica
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Mensagens retornadas com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/Message'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                        required:
                          - messages
                          - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Interface Agent
      summary: Enviar mensagem
      description: Envia uma nova mensagem na sessão
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Mensagem enviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Event Agent
  /events:
    get:
      tags:
        - Event Agent
      summary: Listar eventos
      description: Retorna uma lista paginada de eventos do sistema
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          description: Filtrar por tipo de evento
          schema:
            type: string
        - name: source
          in: query
          description: Filtrar por origem do evento
          schema:
            type: string
        - name: startDate
          in: query
          description: Data inicial para filtro
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Data final para filtro
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Lista de eventos retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/Event'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                        required:
                          - events
                          - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Event Agent
      summary: Criar evento
      description: Cria um novo evento no sistema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Evento criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}:
    get:
      tags:
        - Event Agent
      summary: Obter evento específico
      description: Retorna detalhes de um evento específico
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200':
          description: Evento retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}/process:
    post:
      tags:
        - Event Agent
      summary: Processar evento
      description: Processa um evento específico
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200':
          description: Evento processado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          processedAt:
                            type: string
                            format: date-time
                            description: Data e hora do processamento
                          result:
                            type: object
                            description: Resultado do processamento
                        required:
                          - processedAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evento já foi processado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Planning Agent
  /planning/plans:
    get:
      tags:
        - Planning Agent
      summary: Listar planos
      description: Retorna uma lista paginada de planos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filtrar por status do plano
          schema:
            type: string
            enum: [draft, active, completed, cancelled]
      responses:
        '200':
          description: Lista de planos retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          plans:
                            type: array
                            items:
                              $ref: '#/components/schemas/Plan'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                        required:
                          - plans
                          - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Planning Agent
      summary: Criar plano
      description: Cria um novo plano de execução
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plano criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planning/plans/{planId}:
    get:
      tags:
        - Planning Agent
      summary: Obter plano específico
      description: Retorna detalhes de um plano específico
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      responses:
        '200':
          description: Plano retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Planning Agent
      summary: Atualizar plano
      description: Atualiza um plano existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: Plano atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Planning Agent
      summary: Excluir plano
      description: Remove um plano existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      responses:
        '204':
          description: Plano excluído com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planning/plans/{planId}/execute:
    post:
      tags:
        - Planning Agent
      summary: Executar plano
      description: Inicia a execução de um plano
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanIdParam'
      responses:
        '200':
          description: Execução do plano iniciada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          executionId:
                            type: string
                            format: uuid
                            description: ID da execução
                          startedAt:
                            type: string
                            format: date-time
                            description: Data e hora do início
                        required:
                          - executionId
                          - startedAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Plano já está em execução
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Execution Agent
  /execution/tasks:
    get:
      tags:
        - Execution Agent
      summary: Listar tarefas
      description: Retorna uma lista paginada de tarefas
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filtrar por status da tarefa
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: planId
          in: query
          description: Filtrar por ID do plano
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de tarefas retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/Task'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                        required:
                          - tasks
                          - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Execution Agent
      summary: Criar tarefa
      description: Cria uma nova tarefa de execução
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tarefa criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /execution/tasks/{taskId}:
    get:
      tags:
        - Execution Agent
      summary: Obter tarefa específica
      description: Retorna detalhes de uma tarefa específica
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: Tarefa retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Execution Agent
      summary: Atualizar tarefa
      description: Atualiza uma tarefa existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tarefa atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Execution Agent
      summary: Excluir tarefa
      description: Remove uma tarefa existente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '204':
          description: Tarefa excluída com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /execution/tasks/{taskId}/execute:
    post:
      tags:
        - Execution Agent
      summary: Executar tarefa
      description: Inicia a execução de uma tarefa
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: Execução da tarefa iniciada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          startedAt:
                            type: string
                            format: date-time
                            description: Data e hora do início
                        required:
                          - startedAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tarefa já está em execução
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /execution/tasks/{taskId}/cancel:
    post:
      tags:
        - Execution Agent
      summary: Cancelar tarefa
      description: Cancela a execução de uma tarefa
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: Tarefa cancelada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cancelledAt:
                            type: string
                            format: date-time
                            description: Data e hora do cancelamento
                        required:
                          - cancelledAt
