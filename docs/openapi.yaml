      description: Valida dados contra um schema específico
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Dados a serem validados
              required:
                - data
