version: '3.8'

services:
  # Interface Agent
  interface-agent:
    build:
      context: .
      dockerfile: docker/interface-agent.Dockerfile
    container_name: agentes-interface-agent
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - AGENT_TYPE=interface
      - AWS_REGION=${AWS_REGION}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - agentes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - event-agent

  # Event Agent
  event-agent:
    build:
      context: .
      dockerfile: docker/event-agent.Dockerfile
    container_name: agentes-event-agent
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AGENT_TYPE=event
      - AWS_REGION=${AWS_REGION}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - agentes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Planning Agent
  planning-agent:
    build:
      context: .
      dockerfile: docker/planning-agent.Dockerfile
    container_name: agentes-planning-agent
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - AGENT_TYPE=planning
      - AWS_REGION=${AWS_REGION}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - agentes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - event-agent

  # Execution Agent
  execution-agent:
    build:
      context: .
      dockerfile: docker/execution-agent.Dockerfile
    container_name: agentes-execution-agent
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - AGENT_TYPE=execution
      - AWS_REGION=${AWS_REGION}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - agentes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - planning-agent

  # External Gateway
  external-gateway:
    build:
      context: ./external-gateway
      dockerfile: Dockerfile
    container_name: agentes-external-gateway
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GATEWAY_TYPE=external
      - AWS_REGION=${AWS_REGION}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INTERFACE_AGENT_URL=http://interface-agent:3002
      - EVENT_AGENT_URL=http://event-agent:3003
      - PLANNING_AGENT_URL=http://planning-agent:3004
      - EXECUTION_AGENT_URL=http://execution-agent:3005
    networks:
      - agentes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - interface-agent
      - event-agent
      - planning-agent
      - execution-agent

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: agentes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - agentes-network
    restart: unless-stopped

  # Grafana para visualização
  grafana:
    image: grafana/grafana:latest
    container_name: agentes-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - agentes-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  agentes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16