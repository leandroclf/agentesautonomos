include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

rest-stats {
    enabled = true
    bind-port = 9325
    bind-hostname = "0.0.0.0"
}

queues {
    # Filas para comunicação entre agentes
    interface-events {
        defaultVisibilityTimeout = 10 seconds
        delay = 5 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "interface-events-dlq"
            maxReceiveCount = 3
        }
    }
    
    interface-events-dlq {
        defaultVisibilityTimeout = 10 seconds
        delay = 5 seconds
        receiveMessageWait = 0 seconds
    }
    
    event-processing {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 20 seconds
        deadLettersQueue {
            name = "event-processing-dlq"
            maxReceiveCount = 3
        }
    }
    
    event-processing-dlq {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
    
    planning-requests {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 20 seconds
        deadLettersQueue {
            name = "planning-requests-dlq"
            maxReceiveCount = 3
        }
    }
    
    planning-requests-dlq {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
    
    execution-requests {
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        receiveMessageWait = 20 seconds
        deadLettersQueue {
            name = "execution-requests-dlq"
            maxReceiveCount = 3
        }
    }
    
    execution-requests-dlq {
        defaultVisibilityTimeout = 300 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
    
    # Filas para notificações e status
    notifications {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
    
    status-updates {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
}